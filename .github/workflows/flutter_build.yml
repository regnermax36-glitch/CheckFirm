name: Flutter Build APK

on:
  push:
    branches: [ main, master, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        cache-dependency-path: |
          maxregner/android/*.gradle*
          maxregner/android/gradle/wrapper/gradle-wrapper.properties

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: |
        cd maxregner
        flutter pub get

    - name: Run tests
      run: |
        cd maxregner
        flutter test

    - name: Build APK
      run: |
        cd maxregner
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: maxregner-apk
        path: maxregner/build/app/outputs/flutter-apk/app-release.apk
