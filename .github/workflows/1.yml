name: Build CheckFirm APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        repository: regnermax36-glitch/CheckFirm
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: wrapper
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Clean project
      run: ./gradlew clean
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug
    
    - name: Build Release APK (if signing configured)
      run: ./gradlew assembleRelease
      continue-on-error: true  # Release build may fail without signing keys
    
    - name: List generated APKs
      run: |
        echo "=== Debug APKs ==="
        find app/build/outputs/apk -name "*.apk" -type f
        echo ""
        echo "=== APK Info ==="
        find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: CheckFirm-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
    
    - name: Upload Release APK (if exists)
      uses: actions/upload-artifact@v4
      with:
        name: CheckFirm-Release-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: warn

  # Optional: Build and sign release APK with keystore
  build-signed:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && vars.KEYSTORE_BASE64 != ''
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        repository: regnermax36-glitch/CheckFirm
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: wrapper
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Decode Keystore
      run: |
        echo "${{ vars.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
      env:
        KEYSTORE_BASE64: ${{ vars.KEYSTORE_BASE64 }}
    
    - name: Build and Sign Release APK
      run: ./gradlew assembleRelease
      env:
        SIGNING_KEY_ALIAS: ${{ vars.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
    
    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: CheckFirm-Signed-Release-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
