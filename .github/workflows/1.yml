name: Build CheckFirm APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        repository: regnermax36-glitch/CheckFirm
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Make gradlew executable
      run: chmod +x gradlew
    
    - name: Create dummy keystore.properties
      run: |
        cat > keystore.properties << 'EOF'
        storeFile=dummy.keystore
        storePassword=dummy
        keyAlias=dummy
        keyPassword=dummy
        EOF
        
        # Create dummy keystore file
        keytool -genkey -v -keystore dummy.keystore -alias dummy -keyalg RSA -keysize 2048 -validity 10000 -storepass dummy -keypass dummy -dname "CN=CI"
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CheckFirm-Debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
