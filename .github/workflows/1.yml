name: Docker Build

on:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    container:
      image: reactnativecommunity/react-native-android:latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        repository: regnermax36-glitch/CheckFirm
    
    - name: Fix build files
      run: |
        # Create dummy keystore.properties to satisfy the build
        mkdir -p app
        echo "storeFile=debug.keystore" > keystore.properties
        echo "storePassword=android" >> keystore.properties
        echo "keyAlias=androiddebugkey" >> keystore.properties
        echo "keyPassword=android" >> keystore.properties
        
        # Create debug keystore
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US" -storepass android -keypass android
    
    - name: Build
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: APK
        path: app/build/outputs/apk/debug/*.apk
