name: Build CheckFirm APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        repository: regnermax36-glitch/CheckFirm
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: wrapper
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Remove keystore.properties reference from build.gradle.kts
      run: |
        # Comment out any keystore.properties loading in app/build.gradle.kts
        if [ -f app/build.gradle.kts ]; then
          # Create a backup
          cp app/build.gradle.kts app/build.gradle.kts.bak
          
          # Comment out lines that load keystore.properties
          sed -i 's/^\(.*loadKeystoreProperties.*\)$/\/\/ \1/' app/build.gradle.kts
          sed -i 's/^\(.*keystore\.properties.*\)$/\/\/ \1/' app/build.gradle.kts
          sed -i 's/^\(.*file("keystore\.properties").*\)$/\/\/ \1/' app/build.gradle.kts
          
          # Remove any signingConfig that references keystore for debug builds
          sed -i '/signingConfigs/,/}/ {
            s/signingConfigs(create("release"))/\/\/ &/
            s/signingConfig = signingConfigs.getByName("release")/\/\/ &/
          }' app/build.gradle.kts
          
          echo "Patched build.gradle.kts successfully"
        else
          echo "app/build.gradle.kts not found"
        fi
    
    - name: Create minimal gradle.properties
      run: |
        cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2048m
        android.useAndroidX=true
        android.enableJetifier=true
        android.nonTransitiveRClass=false
        android.nonFinalResIds=false
        EOF
    
    - name: Build Debug APK only
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace
    
    - name: List generated APKs
      run: |
        echo "=== Generated APK Files ==="
        find app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APKs found in app/build/outputs"
        find . -path "*/build/outputs/*" -name "*.apk" -type f 2>/dev/null || echo "No APKs found anywhere"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CheckFirm-Debug
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
        retention-days: 30
        if-no-files-found: warn
