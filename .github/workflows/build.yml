steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # Disable caching for this run since files don't exist yet
        # cache: gradle 

    - name: Generate Gradle Wrapper
      working-directory: ./maxregner
      run: |
        # If gradlew doesn't exist, use the pre-installed 'gradle' on the runner
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build with Gradle
      working-directory: ./maxregner
      run: ./gradlew assembleDebug --no-daemon
